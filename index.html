<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        h1 {
            color: #00ff88;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 0 0 10px #00ff88;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            gap: 100px;
        }

        .score {
            background: rgba(0, 255, 136, 0.1);
            padding: 15px 30px;
            border-radius: 10px;
            border: 2px solid #00ff88;
            min-width: 150px;
        }

        .score h2 {
            color: #00ff88;
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .score p {
            color: #ffffff;
            font-size: 2.5em;
            font-weight: bold;
        }

        canvas {
            display: block;
            background: #000;
            border: 3px solid #00ff88;
            border-radius: 5px;
            margin: 20px auto;
            cursor: none;
            box-shadow: 0 0 20px #00ff88;
        }

        .controls {
            color: #fff;
            margin-top: 20px;
            font-size: 0.95em;
            line-height: 1.8;
        }

        .controls p {
            margin: 5px 0;
        }

        .controls strong {
            color: #00ff88;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PONG GAME</h1>
        <div class="scoreboard">
            <div class="score">
                <h2>Player</h2>
                <p id="playerScore">0</p>
            </div>
            <div class="score">
                <h2>Computer</h2>
                <p id="computerScore">0</p>
            </div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div class="controls">
            <p>Controls:</p>
            <p>🖱️ Mouse: Move left paddle up/down</p>
            <p>⬆️ ⬇️ Arrow Keys: Move left paddle up/down</p>
            <p>Press <strong>SPACE</strong> to pause/resume</p>
        </div>
    </div>

    <script>
        // Get canvas and context
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game Objects
        const paddleWidth = 10;
        const paddleHeight = 80;
        const ballSize = 8;

        const player = {
            x: 10,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            dy: 0,
            speed: 6
        };

        const computer = {
            x: canvas.width - paddleWidth - 10,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            dy: 0,
            speed: 4
        };

        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            dx: 5,
            dy: 5,
            radius: ballSize,
            speed: 5
        };

        let playerScore = 0;
        let computerScore = 0;
        let isPaused = false;

        // Input handling
        const keys = {};
        let mouseY = canvas.height / 2;

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            if (e.key === ' ') {
                e.preventDefault();
                isPaused = !isPaused;
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseY = e.clientY - rect.top;
        });

        // Draw functions
        function drawRect(x, y, width, height, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, width, height);
        }

        function drawCircle(x, y, radius, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawCenterLine() {
            ctx.strokeStyle = '#00ff88';
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw center line
            drawCenterLine();

            // Draw paddles
            drawRect(player.x, player.y, player.width, player.height, '#00ff88');
            drawRect(computer.x, computer.y, computer.width, computer.height, '#ff6b6b');

            // Draw ball
            drawCircle(ball.x, ball.y, ball.radius, '#fff');

            // Draw top and bottom borders
            drawRect(0, 0, canvas.width, 2, '#00ff88');
            drawRect(0, canvas.height - 2, canvas.width, 2, '#00ff88');
        }

        // Update functions
        function updatePlayer() {
            // Keyboard controls (arrow keys)
            if (keys['ArrowUp'] && player.y > 0) {
                player.y -= player.speed;
            }
            if (keys['ArrowDown'] && player.y < canvas.height - player.height) {
                player.y += player.speed;
            }

            // Mouse controls
            const mouseTargetY = mouseY - player.height / 2;
            const distance = mouseTargetY - player.y;
            
            if (Math.abs(distance) > 5) {
                player.y += distance * 0.1;
            }

            // Keep paddle in bounds
            if (player.y < 0) player.y = 0;
            if (player.y > canvas.height - player.height) {
                player.y = canvas.height - player.height;
            }
        }

        function updateComputer() {
            // Simple AI - follow the ball
            const computerCenter = computer.y + computer.height / 2;
            const targetY = ball.y;

            if (computerCenter < targetY - 35) {
                computer.y += computer.speed;
            } else if (computerCenter > targetY + 35) {
                computer.y -= computer.speed;
            }

            // Keep paddle in bounds
            if (computer.y < 0) computer.y = 0;
            if (computer.y > canvas.height - computer.height) {
                computer.y = canvas.height - computer.height;
            }
        }

        function updateBall() {
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Wall collision (top and bottom)
            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                ball.dy *= -1;
                ball.y = Math.max(ball.radius, Math.min(canvas.height - ball.radius, ball.y));
            }

            // Paddle collision detection
            // Player paddle
            if (
                ball.x - ball.radius < player.x + player.width &&
                ball.y > player.y &&
                ball.y < player.y + player.height
            ) {
                ball.dx *= -1;
                ball.x = player.x + player.width + ball.radius;
                
                // Add spin based on where ball hits paddle
                const hitPos = (ball.y - (player.y + player.height / 2)) / (player.height / 2);
                ball.dy += hitPos * 2;
            }

            // Computer paddle
            if (
                ball.x + ball.radius > computer.x &&
                ball.y > computer.y &&
                ball.y < computer.y + computer.height
            ) {
                ball.dx *= -1;
                ball.x = computer.x - ball.radius;
                
                // Add spin based on where ball hits paddle
                const hitPos = (ball.y - (computer.y + computer.height / 2)) / (computer.height / 2);
                ball.dy += hitPos * 2;
            }

            // Score points
            if (ball.x < 0) {
                computerScore++;
                document.getElementById('computerScore').textContent = computerScore;
                resetBall();
            }

            if (ball.x > canvas.width) {
                playerScore++;
                document.getElementById('playerScore').textContent = playerScore;
                resetBall();
            }
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * ball.speed;
            ball.dy = (Math.random() - 0.5) * ball.speed;
        }

        function update() {
            if (!isPaused) {
                updatePlayer();
                updateComputer();
                updateBall();
            }
        }

        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start the game
        gameLoop();
    </script>
</body>
</html>
